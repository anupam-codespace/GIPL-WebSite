<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" filter="url(#glow)" />
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#teamGrad)" stroke-width="8" opacity="0.4" />
  
  <!-- TeamHub Central Emblem: 3 Connected Nodes with Synergy Waves -->
  <!-- Top Node -->
  <circle cx="256" cy="160" r="44" fill="url(#teamGrad)" />
  <!-- Bottom Left Node -->
  <circle cx="170" cy="310" r="40" fill="url(#teamGrad)" />
  <!-- Bottom Right Node -->
  <circle cx="342" cy="310" r="40" fill="url(#teamGrad)" />
  
  <!-- Connecting Dynamic Synergy Arcs -->
  <path d="M 230 195 L 185 275" stroke="url(#teamGrad)" stroke-width="16" stroke-linecap="round" />
  <path d="M 282 195 L 327 275" stroke="url(#teamGrad)" stroke-width="16" stroke-linecap="round" />
  <path d="M 210 310 L 302 310" stroke="url(#teamGrad)" stroke-width="16" stroke-linecap="round" />
  
  <!-- Central Pulse Star -->
  <circle cx="256" cy="256" r="14" fill="#10B981" />
</svg>
