<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" fill="none">
  <!-- Udyam Registration Official Style Emblem & Typography -->
  <g transform="translate(10, 10)">
    <!-- Ashoka Stambh / MSME Emblem Circle -->
    <circle cx="25" cy="25" r="23" stroke="#F59E0B" stroke-width="1.5" fill="rgba(245, 158, 11, 0.08)"/>
    <circle cx="25" cy="25" r="19" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2 2" fill="none"/>
    
    <!-- Central Chakra / Gear Silhouette -->
    <circle cx="25" cy="25" r="13" fill="#F59E0B" opacity="0.2"/>
    <path d="M25 15 L25 35 M15 25 L35 25 M18 18 L32 32 M18 32 L32 18" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="25" cy="25" r="5" fill="#F59E0B"/>
    <circle cx="25" cy="25" r="2.5" fill="#050A14"/>
  </g>

  <!-- Typography -->
  <text x="70" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
    UDYAM
  </text>
  <text x="70" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#F59E0B">
    REGISTRATION
  </text>
  <text x="70" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="500" letter-spacing="0.5" fill="#94A3B8">
    Ministry of MSME, Govt. of India
  </text>
</svg>
